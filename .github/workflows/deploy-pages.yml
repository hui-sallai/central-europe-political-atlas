name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui_baselines:
        description: "UI screenshot baselines: 'verify' (default; missing or mismatching baselines fail) or 'record' (update Linux baselines, upload them as an artifact to review and commit; this mode never deploys)"
        type: choice
        options: [verify, record]
        default: verify

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # v1.81 invariance checks read the anchored v1.8 commit.

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate question-first registry before generated release exports
        run: pnpm workspaces:validate -- --source-only

      - name: Validate local research notebook before generated release exports
        run: pnpm notebook:validate

      - name: Setup Python reference runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Local Projections reference dependencies
        run: python -m pip install -r scripts/validation/requirements-lp-reference.txt

      - name: Verify canonical registry and frozen outputs
        run: |
          pnpm panel-lp:closure-validate:pre-export
          pnpm analysis-registry:validate
          pnpm var:readiness-validate
          pnpm var:residual-closure-validate
          pnpm var:residual-decomposition-validate
          pnpm var:selection-bootstrap-preregister-validate
          pnpm var:selection-bootstrap-closure-validate
          pnpm var:lag-characterization-preregister-validate
          pnpm var:lag-characterization-closure-validate
          pnpm var:country-identifiability-preregister-validate
          pnpm var:country-identifiability-design-validate
          pnpm var:country-matched-bootstrap-preregister-validate
          pnpm var:country-matched-bootstrap-closure-validate
          pnpm var:residual-attribution-preregister-validate
          pnpm var:residual-attribution-validate
          pnpm var:residual-attribution-closure-validate
          pnpm var:publication-boundary-validate
          pnpm var:research-program-closure-validate

      - name: Validate frozen Local Projections
        run: pnpm lp:validate

      - name: Validate aggregate-shock panel reference and production
        run: |
          pnpm panel-lp:reference
          pnpm panel-lp:validate
          pnpm panel-lp:ui-validate
          pnpm panel-lp:robustness-validate

      - name: Validate news and identified shocks
        run: |
          pnpm news:validate
          pnpm political-audit:validate
          pnpm political-data:validate
          pnpm political-data:test
          pnpm jk:validate
          pnpm information-effect:validate

      - name: Validate historical-extension audit boundary
        run: |
          pnpm baseline-definition:validate
          pnpm historical-extension:validate
          pnpm historical-extension:closure-validate

      - name: Export research data
        run: pnpm export:research-data
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          REUSE_FROZEN_RESEARCH_OUTPUTS: "1"

      - name: Build versioned research package
        run: |
          node scripts/panel-local-projections/test-publication.mjs
          pnpm package:research-data

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Research-data guard and data-refresh tooling tests
        run: pnpm tooling:test

      - name: Scan tracked files for secrets and local artifacts
        run: pnpm security:scan

      - name: Research validation
        run: pnpm research:validate

      - name: Advanced analysis validation
        run: pnpm analysis:validate

      - name: UI language QA
        run: pnpm ui-language:qa

      - name: Build simplified home map
        run: pnpm map:home

      - name: Build static site
        run: pnpm build:site

      - name: SEO and UI regression checks
        run: |
          pnpm i18n:validate
          pnpm seo:validate
          pnpm ui:regression-validate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: UI tests (screenshots, accessibility, canonical)
        if: inputs.ui_baselines != 'record'
        run: pnpm test:ui

      - name: Fail if the UI tests wrote screenshot baselines
        if: inputs.ui_baselines != 'record'
        run: |
          changes="$(git status --porcelain -- tests/ui/__screenshots__)"
          if [ -n "$changes" ]; then
            echo "UI tests modified committed baselines (baselines are only written in the record mode):"
            echo "$changes"
            exit 1
          fi

      - name: Record Linux screenshot baselines (deliberate mode)
        if: inputs.ui_baselines == 'record'
        run: pnpm test:ui:update

      - name: Upload UI test diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Upload recorded Linux screenshot baselines
        if: inputs.ui_baselines == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: ui-baselines-linux
          path: tests/ui/__screenshots__/linux/
          retention-days: 30

      - name: Release QA
        run: pnpm release:validate

      - name: Scan generated public site for secrets
        run: node scripts/security/check-public-secrets.mjs --static

      - name: Add nojekyll marker
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    if: inputs.ui_baselines != 'record'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
