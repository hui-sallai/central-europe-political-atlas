name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macro-dynamics readiness
        run: pnpm macro:build

      - name: Export research data
        run: pnpm export:research-data

      - name: Build versioned research package
        run: pnpm package:research-data

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Scan tracked files for secrets and local artifacts
        run: pnpm security:scan

      - name: Research validation
        run: pnpm research:validate

      - name: Advanced analysis validation
        run: pnpm analysis:validate

      - name: UI language QA
        run: pnpm ui-language:qa

      - name: Build simplified home map
        run: pnpm map:home

      - name: Build static site
        run: pnpm build:site

      - name: Release QA
        run: pnpm release:validate

      - name: Add nojekyll marker
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
